<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080810;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}

#stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  pointer-events:none;
  z-index:10;
}

#label{
  font-size:11px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.3);
  opacity:0;
  transform:translateY(8px);
  transition:opacity 1s ease, transform 1s ease;
  margin-bottom:20px;
}
#title{
  font-size:clamp(52px,9vw,110px);
  font-weight:200;
  letter-spacing:-0.02em;
  color:#fff;
  opacity:0;
  transform:translateY(20px);
  transition:opacity 1.2s ease, transform 1.2s ease;
  line-height:1;
}
#sub{
  font-size:13px;
  color:rgba(255,255,255,0.55);
  letter-spacing:0.06em;
  margin-top:18px;
  opacity:0;
  transition:opacity 1s ease;
  transition-delay:0s;
  font-style:italic;
}
#attribution{
  font-size:11px;
  color:rgba(255,255,255,0.3);
  letter-spacing:0.08em;
  font-style:normal;
  margin-top:7px;
  opacity:0;
  transition:opacity 1s ease;
}
#cta{
  margin-top:52px;
  opacity:0;
  pointer-events:all;
  cursor:pointer;
  display:flex;align-items:center;gap:10px;
  color:rgba(255,255,255,0.55);
  font-size:13px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(0,0,0,0.6);
  padding:7px 14px;
  border-radius:20px;
  transition:color 0.2s, background 0.2s, opacity 0.8s;
}
#cta:hover{color:rgba(255,255,255,0.95);background:rgba(255,255,255,0.1)}

@media(max-width:600px){
  #title{padding:0 20px;text-align:center}
  #sub{font-size:12px;padding:0 24px;text-align:center}
  #attribution{font-size:10px;padding:0 24px;text-align:center}
  #cta{margin-top:36px;font-size:12px}
}

#overlay{
  position:fixed;inset:0;
  background:#080810;
  z-index:50;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.7s ease;
}
#overlay.fade{opacity:1;pointer-events:all}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="stage">
  <div id="title">Motus</div>
  <div id="sub">se vogliamo che tutto rimanga com'è, bisogna che tutto cambi</div>
  <div id="attribution">— Tomasi di Lampedusa, <em>Il Gattopardo</em></div>
  <button id="cta">
    <span>Scopri di più</span>
    <span style="font-size:16px;line-height:1">→</span>
  </button>
</div>

<div id="overlay"></div>

<script>

/* ── PLASMA LAVA ─────────────────────────────────────────────────────────── */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,tick=0;
const mouse={x:-1,y:-1};

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});

/* metaballs */
const blobs=[
  {x:0.3,y:0.4,vx:0.0006,vy:0.0004,r:0.22,hue:18},
  {x:0.6,y:0.5,vx:-0.0005,vy:0.0007,r:0.26,hue:340},
  {x:0.5,y:0.3,vx:0.0007,vy:-0.0005,r:0.18,hue:45},
  {x:0.2,y:0.6,vx:0.0004,vy:0.0006,r:0.20,hue:8},
  {x:0.75,y:0.65,vx:-0.0006,vy:-0.0004,r:0.24,hue:28},
  {x:0.5,y:0.7,vx:0.0003,vy:-0.0008,r:0.15,hue:355},
];

function drawPlasma(){
  tick++;
  ctx.fillStyle='#060305';
  ctx.fillRect(0,0,W,H);

  /* aggiorna posizioni con rimbalzo morbido */
  blobs.forEach(b=>{
    b.x+=b.vx*(1+Math.sin(tick*0.003)*0.3);
    b.y+=b.vy*(1+Math.cos(tick*0.0025)*0.3);
    if(b.x<0.05||b.x>0.95) b.vx*=-1;
    if(b.y<0.05||b.y>0.95) b.vy*=-1;
    /* debole attrazione verso mouse */
    if(mouse.x>0){
      const mx=mouse.x/W, my=mouse.y/H;
      b.vx+=(mx-b.x)*0.000015;
      b.vy+=(my-b.y)*0.000015;
    }
  });

  /* disegna ogni blob come radial gradient in screen mode */
  ctx.save();
  ctx.globalCompositeOperation='screen';
  blobs.forEach(b=>{
    const cx=b.x*W, cy=b.y*H;
    const r=b.r*Math.min(W,H);
    const pulse=1+Math.sin(tick*0.018+b.hue)*0.08;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*pulse);
    g.addColorStop(0,  `hsla(${b.hue},100%,70%,0.55)`);
    g.addColorStop(0.4,`hsla(${b.hue},90%,50%,0.30)`);
    g.addColorStop(0.75,`hsla(${b.hue+20},80%,35%,0.12)`);
    g.addColorStop(1,  `hsla(${b.hue},70%,20%,0)`);
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
  });
  ctx.restore();

  /* vignette scura ai bordi */
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.85);
  vig.addColorStop(0,'rgba(0,0,0,0)');
  vig.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.fillStyle=vig;
  ctx.fillRect(0,0,W,H);

  requestAnimationFrame(drawPlasma);
}
drawPlasma();
/* ── FINE PLASMA ─────────────────────────────────────────────────────────── */


// Sequenza di entrata
const title=document.getElementById('title');
const sub=document.getElementById('sub');
const cta=document.getElementById('cta');

setTimeout(()=>{
  title.style.opacity='1';title.style.transform='translateY(0)';
},400);
setTimeout(()=>{
  sub.style.opacity='1';
},1600);
setTimeout(()=>{
  cta.style.opacity='1';
},2200);
setTimeout(()=>{
  document.getElementById('attribution').style.opacity='1';
},1900);

function goTo(url){
  const ov=document.getElementById('overlay');
  ov.classList.add('fade');
  setTimeout(()=>{window.location.href=url;},700);
}
cta.addEventListener('click',()=>goTo('info.html'));
</script>
</body>
</html>
