<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080810;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}

#stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  pointer-events:none;
  z-index:10;
}

#label{
  font-size:11px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.3);
  opacity:0;
  transform:translateY(8px);
  transition:opacity 1s ease, transform 1s ease;
  margin-bottom:20px;
}
#title{
  font-size:clamp(52px,9vw,110px);
  font-weight:200;
  letter-spacing:-0.02em;
  color:#fff;
  opacity:0;
  transform:translateY(20px);
  transition:opacity 1.2s ease, transform 1.2s ease;
  line-height:1;
}
#sub{
  font-size:13px;
  color:rgba(255,255,255,0.28);
  letter-spacing:0.08em;
  margin-top:18px;
  opacity:0;
  transition:opacity 1s ease;
  transition-delay:0s;
}
#attribution{
  font-size:11px;
  color:rgba(255,255,255,0.18);
  letter-spacing:0.08em;
  font-style:italic;
  margin-top:8px;
  opacity:0;
  transition:opacity 1s ease;
}
#cta{
  margin-top:52px;
  opacity:0;
  pointer-events:all;
  cursor:pointer;
  display:flex;align-items:center;gap:10px;
  color:rgba(255,255,255,0.55);
  font-size:13px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(0,0,0,0.6);
  padding:7px 14px;
  border-radius:20px;
  transition:color 0.2s, background 0.2s, opacity 0.8s;
}
#cta:hover{color:rgba(255,255,255,0.95);background:rgba(255,255,255,0.1)}

#overlay{
  position:fixed;inset:0;
  background:#080810;
  z-index:50;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.7s ease;
}
#overlay.fade{opacity:1;pointer-events:all}

</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="stage">
  <div id="title">Motus</div>
  <div id="sub">se vogliamo che tutto rimanga com'è, bisogna che tutto cambi</div>
  <div id="attribution">— Tomasi di Lampedusa, <em>Il Gattopardo</em></div>
  <button id="cta">
    <span>Scopri di più</span>
    <span style="font-size:16px;line-height:1">→</span>
  </button>
</div>

<div id="overlay"></div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,tick=0,particles=[];
const mouse={x:0,y:0};

function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});

function rand(a,b){return a+Math.random()*(b-a)}

class Particle{
  constructor(){
    this.x=rand(0,W);this.y=rand(0,H);
    this.vx=rand(-0.4,0.4);this.vy=rand(-0.4,0.4);
    this.r=rand(1,3);
    this.hue=rand(200,280);
    this.trail=[];
    this.phase=rand(0,Math.PI*2);
  }
}
for(let i=0;i<180;i++) particles.push(new Particle());

function draw(){
  tick++;
  ctx.fillStyle='rgba(8,8,16,0.15)';ctx.fillRect(0,0,W,H);

  particles.forEach(p=>{
    const dx=mouse.x-p.x,dy=mouse.y-p.y;
    const dist=Math.sqrt(dx*dx+dy*dy)+1;
    const wave=Math.sin(p.x*0.02+tick*0.015+p.phase)*0.06;
    const wave2=Math.cos(p.y*0.018+tick*0.012+p.phase)*0.06;
    p.vx+=wave2;p.vy+=wave;
    if(dist<200){
      p.vx+=dx/dist*0.04;p.vy+=dy/dist*0.04;
    }
    p.vx*=0.985;p.vy*=0.985;
    const speed=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    if(speed>2.5){const s=2.5/speed;p.vx*=s;p.vy*=s;}
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10;
    if(p.y<-10)p.y=H+10; if(p.y>H+10)p.y=-10;
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>18) p.trail.shift();

    if(p.trail.length>2){
      ctx.beginPath();
      ctx.moveTo(p.trail[0].x,p.trail[0].y);
      for(let i=1;i<p.trail.length;i++) ctx.lineTo(p.trail[i].x,p.trail[i].y);
      ctx.strokeStyle=`hsla(${p.hue},70%,65%,0.18)`;
      ctx.lineWidth=p.r*0.5;ctx.lineCap='round';ctx.stroke();
    }
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},75%,70%,0.6)`;ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

// Sequenza di entrata
const title=document.getElementById('title');
const sub=document.getElementById('sub');
const cta=document.getElementById('cta');

setTimeout(()=>{
  title.style.opacity='1';title.style.transform='translateY(0)';
},400);
setTimeout(()=>{
  sub.style.opacity='1';
},1600);
setTimeout(()=>{
  cta.style.opacity='1';
},2200);
setTimeout(()=>{
  document.getElementById('attribution').style.opacity='1';
},1900);

function goTo(url){
  const ov=document.getElementById('overlay');
  ov.classList.add('fade');
  setTimeout(()=>{window.location.href=url;},700);
}
cta.addEventListener('click',()=>goTo('info.html'));
</script>
</body>
</html>
