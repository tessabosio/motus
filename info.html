<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080810;font-family:system-ui,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}

#home-btn{
  position:fixed;top:16px;right:16px;z-index:20;
  background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.55);
  font:13px/1 system-ui,sans-serif;padding:7px 14px;border-radius:20px;
  cursor:pointer;border:1px solid rgba(255,255,255,0.18);
  transition:background .2s,color .2s;user-select:none;letter-spacing:0.06em;
}
#home-btn:hover{background:rgba(255,255,255,0.1);color:#fff}

#stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:10;
  pointer-events:none;
}

#manifesto{
  font-size:clamp(13px,1.6vw,18px);
  font-weight:300;
  color:rgba(255,255,255,0.62);
  letter-spacing:0.06em;
  text-align:center;
  line-height:1.9;
  max-width:520px;
  padding:0 32px;
  opacity:0;
  font-style:italic;
  transform:translateY(10px);
  transition:opacity 1s ease, transform 1s ease;
}
#manifesto em{
  color:rgba(255,255,255,0.9);
  font-style:normal;
}

#modes{
  display:flex;
  gap:clamp(12px,2.5vw,28px);
  margin-top:clamp(40px,6vh,72px);
  pointer-events:all;
}

.mcard{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  cursor:default;
  opacity:0;
  transform:translateY(16px);
  transition:opacity 0.7s ease, transform 0.7s ease;
}

.mcard-orbit{
  position:relative;
  width:64px;height:64px;
}
.mcard-orbit svg{
  width:64px;height:64px;
  position:absolute;inset:0;
}
.ring{
  fill:none;
  stroke:rgba(255,255,255,0.07);
  stroke-width:1;
  transition:stroke 0.4s;
}
.mcard:hover .ring{stroke:rgba(255,255,255,0.22);}

.dot{
  position:absolute;
  width:5px;height:5px;
  border-radius:50%;
  top:50%;left:50%;
  margin:-2.5px 0 0 -2.5px;
  background:rgba(255,255,255,0.3);
  transition:background 0.4s;
}
.mcard:hover .dot{background:rgba(255,255,255,0.9);}

.mcard-icon{
  position:absolute;
  inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  opacity:0.75;
  transition:opacity 0.4s;
  user-select:none;
}
.mcard:hover .mcard-icon{opacity:1;}

.mcard-labels{text-align:center;line-height:1;}
.mcard-name{
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.65);
  transition:color 0.4s;
}
.mcard:hover .mcard-name{color:rgba(255,255,255,0.9);}
.mcard-phys{
  font-size:10px;
  letter-spacing:0.12em;
  color:rgba(255,255,255,0.38);
  margin-top:5px;
  transition:color 0.4s;
  font-style:italic;
}
.mcard:hover .mcard-phys{color:rgba(255,255,255,0.65);}

#cta-row{
  margin-top:clamp(40px,6vh,72px);
  pointer-events:all;
  opacity:0;
  transition:opacity 0.8s ease;
}
#go-sim{
  display:flex;align-items:center;gap:10px;
  color:rgba(255,255,255,0.5);
  font-size:13px;letter-spacing:0.12em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(0,0,0,0.6);
  padding:7px 14px;border-radius:20px;
  cursor:pointer;
  transition:color 0.2s,background 0.2s;
}
#go-sim:hover{color:rgba(255,255,255,0.95);background:rgba(255,255,255,0.1);}

@media(max-width:600px){
  #manifesto{font-size:13px;padding:0 20px}
  #modes{
    flex-wrap:wrap;
    justify-content:center;
    gap:20px 16px;
    padding:0 16px;
  }
  .mcard{min-width:70px}
  #cta-row{margin-top:32px}
}

#overlay{position:fixed;inset:0;background:#080810;z-index:50;pointer-events:none;opacity:0;transition:opacity 0.7s ease}
#overlay.fade{opacity:1;pointer-events:all}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="home-btn">← Home</button>

<div id="stage">

  <div id="manifesto">
  Siamo <em>materia e legge</em> nello stesso istante.<br>
Ogni&nbsp;traiettoria&nbsp;è&nbsp;una&nbsp;<em>possibilità&nbsp;che&nbsp;prende&nbsp;forma</em>.<br>
Ogni forza indica una <em>direzione</em>.<br>
Ogni movimento racconta una <em>sensazione</em>.
  </div>

  <div id="modes">

    <div class="mcard" id="mc0">
      <div class="mcard-orbit">
        <svg viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="28"/></svg>
        <div class="mcard-icon">🌍</div>
        <div class="dot" id="dot0"></div>
      </div>
      <div class="mcard-labels">
        <div class="mcard-name">Destino</div>
        <div class="mcard-phys">gravità</div>
      </div>
    </div>

    <div class="mcard" id="mc1">
      <div class="mcard-orbit">
        <svg viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="28"/></svg>
        <div class="mcard-icon">🪐</div>
        <div class="dot" id="dot1"></div>
      </div>
      <div class="mcard-labels">
        <div class="mcard-name">Ritorno</div>
        <div class="mcard-phys">orbite</div>
      </div>
    </div>

    <div class="mcard" id="mc2">
      <div class="mcard-orbit">
        <svg viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="28"/></svg>
        <div class="mcard-icon">〰️</div>
        <div class="dot" id="dot2"></div>
      </div>
      <div class="mcard-labels">
        <div class="mcard-name">Risonanza</div>
        <div class="mcard-phys">onde</div>
      </div>
    </div>

    <div class="mcard" id="mc3">
      <div class="mcard-orbit">
        <svg viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="28"/></svg>
        <div class="mcard-icon">🧲</div>
        <div class="dot" id="dot3"></div>
      </div>
      <div class="mcard-labels">
        <div class="mcard-name">Attrazione</div>
        <div class="mcard-phys">magnetismo</div>
      </div>
    </div>

    <div class="mcard" id="mc4">
      <div class="mcard-orbit">
        <svg viewBox="0 0 64 64"><circle class="ring" cx="32" cy="32" r="28"/></svg>
        <div class="mcard-icon">🌀</div>
        <div class="dot" id="dot4"></div>
      </div>
      <div class="mcard-labels">
        <div class="mcard-name">Origine</div>
        <div class="mcard-phys">caos</div>
      </div>
    </div>

  </div>

  <div id="cta-row">
    <button id="go-sim">
      <span>Esplora la simulazione</span>
      <span style="font-size:16px;line-height:1">→</span>
    </button>
  </div>

</div>

<div id="overlay"></div>

<script>
/* canvas background */
/* ── CAMPO DI FORZE ──────────────────────────────────────────────────────── */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,tick=0;
const mouse={x:-1,y:-1};

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  initParticles();
}
window.addEventListener('resize',resize);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});

const NUM=520;
let pts=[];

function initParticles(){
  pts=[];
  for(let i=0;i<NUM;i++){
    pts.push({
      x:Math.random()*W, y:Math.random()*H,
      age:Math.floor(Math.random()*80),
      speed:Math.random()*1.2+0.4,
      hue:190+Math.random()*60,
      life:60+Math.floor(Math.random()*60),
    });
  }
}

function fieldAngle(x,y,t){
  const k=0.004;
  let angle = Math.sin(x*k + t*0.008) * Math.cos(y*k*0.9 + t*0.006) * Math.PI*2
             + Math.cos(x*k*0.6 - y*k*0.7 + t*0.005) * Math.PI;
  if(mouse.x>0){
    const dx=mouse.x-x, dy=mouse.y-y;
    const dist=Math.sqrt(dx*dx+dy*dy)+1;
    const pull=Math.min(1,180/dist);
    const mangle=Math.atan2(dy,dx);
    angle=angle*(1-pull*0.7)+mangle*pull*0.7;
  }
  return angle;
}

function drawField(){
  tick++;
  ctx.fillStyle='rgba(5,5,12,0.18)';
  ctx.fillRect(0,0,W,H);

  pts.forEach(p=>{
    p.age++;
    if(p.age>p.life){
      p.x=Math.random()*W; p.y=Math.random()*H;
      p.age=0; p.life=60+Math.floor(Math.random()*60);
      p.hue=190+Math.random()*60;
      p.speed=Math.random()*1.2+0.4;
      return;
    }
    const angle=fieldAngle(p.x,p.y,tick);
    const px=p.x, py=p.y;
    p.x+=Math.cos(angle)*p.speed;
    p.y+=Math.sin(angle)*p.speed;
    let wrapped=false;
    if(p.x<0){p.x=W;wrapped=true;} if(p.x>W){p.x=0;wrapped=true;}
    if(p.y<0){p.y=H;wrapped=true;} if(p.y>H){p.y=0;wrapped=true;}
    if(wrapped) return;

    const lifeRatio=1-p.age/p.life;
    const alpha=Math.sin(lifeRatio*Math.PI)*0.55;
    const hueShift=p.hue+Math.sin(tick*0.01+p.speed)*18;
    ctx.beginPath();
    ctx.moveTo(px,py); ctx.lineTo(p.x,p.y);
    ctx.strokeStyle=`hsla(${hueShift},75%,68%,${alpha})`;
    ctx.lineWidth=0.9; ctx.lineCap='round'; ctx.stroke();
  });

  if(mouse.x>0){
    const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,90);
    g.addColorStop(0,'rgba(120,180,255,0.07)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  requestAnimationFrame(drawField);
}
resize();
drawField();
/* ── FINE CAMPO DI FORZE ─────────────────────────────────────────────────── */
/* ── FINE AURORA ─────────────────────────────────────────────────────────── */

/* punti orbitanti */
const orbits=[
  {speed:0.008,phase:0},
  {speed:0.013,phase:1.2},
  {speed:0.006,phase:2.5},
  {speed:0.011,phase:0.7},
  {speed:0.009,phase:3.8},
];
const dots=orbits.map((_,i)=>document.getElementById('dot'+i));
const R=28;
let ot=0;
function animateDots(){
  ot++;
  orbits.forEach((o,i)=>{
    const angle=ot*o.speed+o.phase;
    dots[i].style.transform=`translate(${R*Math.cos(angle)}px,${R*Math.sin(angle)}px)`;
  });
  requestAnimationFrame(animateDots);
}
animateDots();

/* entrata */
setTimeout(()=>{
  const m=document.getElementById('manifesto');
  m.style.opacity='1';m.style.transform='translateY(0)';
},400);
[0,1,2,3,4].forEach(i=>{
  setTimeout(()=>{
    const mc=document.getElementById('mc'+i);
    mc.style.opacity='1';mc.style.transform='translateY(0)';
  },900+i*120);
});
setTimeout(()=>{document.getElementById('cta-row').style.opacity='1';},1700);

/* navigazione */
function goTo(url){
  const ov=document.getElementById('overlay');
  ov.classList.add('fade');
  setTimeout(()=>{window.location.href=url;},700);
}
document.getElementById('home-btn').addEventListener('click',()=>goTo('index.html'));
document.getElementById('go-sim').addEventListener('click',()=>goTo('movimento.html'));
</script>
</body>
</html>
